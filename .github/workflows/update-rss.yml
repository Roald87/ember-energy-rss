name: Update RSS Feed

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily

permissions:
  contents: write

jobs:
  update-rss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xmllint
        run: sudo apt-get install -y libxml2-utils

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run unit tests
        run: dotnet run --project tests/EmberEnergyRss.Tests/EmberEnergyRss.Tests.fsproj

      - name: Generate RSS feed
        run: dotnet run --project src/EmberEnergyRss/EmberEnergyRss.fsproj -- rss.xml

      - name: Validate RSS XML
        run: xmllint --noout rss.xml

      - name: Commit updated feed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rss.xml
          git diff --staged --quiet || git commit -m "chore: update rss.xml [$(date -u '+%Y-%m-%d')]"
          git push
